name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/comments-storage

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --pretty false
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144